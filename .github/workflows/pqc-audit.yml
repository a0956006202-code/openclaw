name: OpenClaw PQC Cryptographic Audit

on:
  schedule:
    - cron: '0 4 1 */3 *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Audit PQC key inventory
        run: python pqc_crypto_policy.py audit data/security/pqc-key-inventory.json
