name: OpenClaw Auto Workflow

on:
  schedule:
    # 每天 UTC 00:00 執行，也就是台灣時間上午 8:00。
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  run-openclaw:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Run OpenClaw main script
        run: python main.py