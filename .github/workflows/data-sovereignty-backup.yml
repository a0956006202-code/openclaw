name: OpenClaw Data Sovereignty Backup

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install backup tools
        run: sudo apt-get update && sudo apt-get install --yes age rclone

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
